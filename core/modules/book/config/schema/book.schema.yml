# Schema for the configuration files of the book module.

book.settings:
  type: config_object
  label: 'Book settings'
  constraints:
    FullyValidatable: ~
  mapping:
    # @todo Simple config cannot have dependencies on any other config. Remove this in <issue to be created>
    allowed_types:
      type: sequence
      label: 'Content types allowed in book outlines'
      # >=1 content type must be listed here.
      constraints:
        NotBlank: []
      sequence:
        type: string
        label: 'Content type'
        constraints:
          EntityBundleExists: node
    block:
      type: mapping
      label: 'Block'
      mapping:
        navigation:
          type: mapping
          label: 'Navigation'
          mapping:
            mode:
              type: string
              label: 'Mode'
              constraints:
                Choice:
                  # @see \Drupal\book\Plugin\Block\BookNavigationBlock::blockForm()
                  - all pages
                  - book pages
    # @todo Simple config cannot have dependencies on any other config. Remove this in <issue to be created>
    child_type:
      type: string
      label: 'Content type for child pages'
      constraints:
        EntityBundleExists: node
        ExistsIn:
          selector: '%parent.allowed_types'
          which: values
          message: The content type for the <em>Add child page</em> link must be one of those selected as an allowed book outline type.

block.settings.book_navigation:
  type: block_settings
  label: 'Book navigation block'
  mapping:
    block_mode:
      type: string
      label: 'Block display mode'
