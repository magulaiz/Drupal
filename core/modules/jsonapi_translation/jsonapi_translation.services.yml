services:
  jsonapi_translation.route_subscriber:
    class: Drupal\jsonapi_translation\Routing\RouteSubscriber
    arguments: ['@jsonapi.resource_type.repository']
    tags:
      - { name: event_subscriber }
  jsonapi_translation.response_subscriber:
    class: Drupal\jsonapi_translation\EventSubscriber\ResponseSubscriber
    tags:
      - { name: event_subscriber }

  # Controller.
  jsonapi_translation.entity_resource:
    class: Drupal\jsonapi_translation\Controller\EntityResource
    parent: jsonapi.entity_resource
    calls:
      -
        method: 'setLanguageManager'
        arguments: ['@language_manager']
  Drupal\jsonapi_translation\Controller\EntityResource: '@jsonapi_translation.entity_resource'
