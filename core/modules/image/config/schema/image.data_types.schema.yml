# Basic data types for image.

image_size:
  type: mapping
  mapping:
    width:
      type: integer
      label: 'Width'
      nullable: true
    height:
      type: integer
      label: 'Height'
      nullable: true

field_default_image:
  type: mapping
  mapping:
    uuid:
      type: uuid
      nullable: true
    alt:
      type: label
      label: 'Alternative text'
    title:
      type: label
      label: 'Title'
    width:
      type: integer
      label: 'Width'
      nullable: true
    height:
      type: integer
      label: 'Height'
      nullable: true
