file.ajax_progress:
  path: '/file/progress/{key}'
  defaults:
    _controller: '\Drupal\file\Controller\FileWidgetAjaxController::progress'
  requirements:
    _permission: 'access content'

file.multiple_delete_confirm:
  path: '/admin/content/file/delete'
  defaults:
    _form: '\Drupal\file\Form\FileDeleteMultiple'
  requirements:
    _permission: 'access files overview'
