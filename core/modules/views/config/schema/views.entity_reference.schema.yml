# Schema for the entity reference 'views' selection handler settings.

entity_reference_selection.views:
  type: entity_reference_selection
  label: 'Views selection handler settings'
  mapping:
    view:
      type: mapping
      label: 'View used to select the entities'
      mapping:
        view_name:
          type: string
          label: 'View name'
        display_name:
          type: string
          label: 'Display name'
        arguments:
          type: sequence
          label: 'View arguments'
          sequence:
            type: string
            label: 'Argument'

entity_reference_selection.views_auto_create:
  type: entity_reference_selection.views
  label: 'Views selection handler settings'
  mapping:
    auto_create:
      type: boolean
      label: 'Create referenced entities if they don''t already exist'
    auto_create_bundle:
      type: string
      label: 'Bundle assigned to the auto-created entities.'

# Schema for all entity reference 'views_auto_create:*' selection handlers that are not
# providing a specific schema.
entity_reference_selection.views_auto_create:*:
  type: entity_reference_selection.views_auto_create
