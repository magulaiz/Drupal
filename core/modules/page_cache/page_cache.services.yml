services:
  http_middleware.page_cache:
    class: Drupal\page_cache\StackMiddleware\PageCache
    autowire: true
    arguments:
      $cache: '@cache.page'
    tags:
      - { name: http_middleware, priority: 200, responder: true }

  cache.page:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [page]
