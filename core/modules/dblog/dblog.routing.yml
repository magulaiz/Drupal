dblog.overview:
  path: '/admin/reports/dblog'
  defaults:
    _entity_list: 'dblog'
    _title: 'Recent log messages'
  requirements:
    _permission: 'access site reports'

dblog.confirm:
  path: '/admin/reports/dblog/confirm'
  defaults:
    _form: '\Drupal\dblog\Form\DblogClearLogConfirmForm'
    _title: 'Confirm delete recent log messages'
  requirements:
    _permission: 'access site reports'

entity.dblog.canonical:
  path: '/admin/reports/dblog/event/{dblog}'
  defaults:
    _entity_view: 'dblog.full'
    _title: 'Details'
  requirements:
    _permission: 'access site reports'

dblog.page_not_found:
  path: '/admin/reports/page-not-found'
  defaults:
    _title: "Top 'page not found' errors"
    _controller: '\Drupal\dblog\Controller\TopDblogMessagesController::list'
    type: 'page not found'
  requirements:
    _permission: 'access site reports'

dblog.access_denied:
  path: '/admin/reports/access-denied'
  defaults:
    _title: "Top 'access denied' errors"
    _controller: '\Drupal\dblog\Controller\TopDblogMessagesController::list'
    type: 'access denied'
  requirements:
    _permission: 'access site reports'

dblog.search:
  path: '/admin/reports/search'
  defaults:
    _controller: '\Drupal\dblog\Controller\TopDblogMessagesController::list'
    _title: 'Top search phrases'
    type: 'search'
  requirements:
    _module_dependencies: 'search'
    _permission: 'access site reports'
