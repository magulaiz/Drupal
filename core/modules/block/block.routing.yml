block.admin_demo:
  path: '/admin/appearance/block/demo/{theme}'
  defaults:
    _controller: '\Drupal\block\Controller\BlockController::demo'
    _title_callback: 'theme_handler:getName'
  requirements:
    _access_theme: 'TRUE'
    _permission: 'administer blocks'
  options:
    _admin_route: FALSE

# @todo Deprecate this route once
#   https://www.drupal.org/project/drupal/issues/3159210 is fixed, or remove
#   it in Drupal 11.
# @see https://www.drupal.org/node/3318112
block.admin_demo.bc:
  path: '/admin/structure/block/demo/{theme}'
  defaults:
    _controller: '\Drupal\block\Controller\BlockController::blockLayoutRedirect'
  requirements:
    _access_theme: 'TRUE'
    _permission: 'administer blocks'
  options:
    _admin_route: FALSE

entity.block.delete_form:
  path: '/admin/appearance/block/manage/{block}/delete'
  defaults:
    _entity_form: 'block.delete'
    _title: 'Remove block'
  requirements:
    _permission: 'administer blocks'

# @todo Deprecate this route once
#   https://www.drupal.org/project/drupal/issues/3159210 is fixed, or remove
#   it in Drupal 11.
# @see https://www.drupal.org/node/3318112
entity.block.delete_form.bc:
  path: '/admin/structure/block/manage/{block}/delete'
  defaults:
    _controller: '\Drupal\block\Controller\BlockController::blockLayoutRedirect'
  requirements:
    _permission: 'administer blocks'

entity.block.edit_form:
  path: '/admin/appearance/block/manage/{block}'
  defaults:
    _entity_form: 'block.default'
    _title: 'Configure block'
  requirements:
    _entity_access: 'block.update'

# @todo Deprecate this route once
#   https://www.drupal.org/project/drupal/issues/3159210 is fixed, or remove
#   it in Drupal 11.
# @see https://www.drupal.org/node/3318112
entity.block.edit_form.bc:
  path: '/admin/structure/block/manage/{block}'
  defaults:
    _controller: '\Drupal\block\Controller\BlockController::blockLayoutRedirect'
  requirements:
    _entity_access: 'block.update'

entity.block.enable:
  path: '/admin/appearance/block/manage/{block}/enable'
  defaults:
    _controller: '\Drupal\block\Controller\BlockController::performOperation'
    op: enable
  requirements:
    _entity_access: 'block.enable'
    _csrf_token: 'TRUE'

entity.block.disable:
  path: '/admin/appearance/block/manage/{block}/disable'
  defaults:
    _controller: '\Drupal\block\Controller\BlockController::performOperation'
    op: disable
  requirements:
    _entity_access: 'block.disable'
    _csrf_token: 'TRUE'

block.admin_display:
  path: '/admin/appearance/block'
  defaults:
    _controller: '\Drupal\block\Controller\BlockListController::listing'
