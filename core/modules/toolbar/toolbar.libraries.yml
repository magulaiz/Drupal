toolbar:
  version: VERSION
  js:
    # Core.
    # Add a separate shim.
    js/toolbar.shim.js: { }
    # Reduce the weight of this one so it loads before the shim that
    # modifies it
    js/toolbar.js: { weight: -1 }
    # Models.
    js/models/MenuModel.js: {}
    js/models/ToolbarModel.js: {}
    # Views.
    js/views/BodyVisualView.js: {}
    js/views/MenuVisualView.js: {}
    js/views/ToolbarAuralView.js: {}
    js/views/ToolbarVisualView.js: {}
  css:
    component:
      css/toolbar.module.css: {}
    theme:
      css/toolbar.theme.css: {}
      css/toolbar.icons.theme.css: {}
  dependencies:
    - core/modernizr
    - core/jquery
    - core/drupal
    - core/drupalSettings
    - core/drupal.ajax
    - core/drupal.announce
    - core/backbone
    - core/once
    - core/jquery.once.bc
    - core/drupal.displace
    - toolbar/toolbar.menu

toolbar.menu:
  version: VERSION
  js:
    js/toolbar.menu.js: {}
  css:
    state:
      css/toolbar.menu.css: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/once
    - core/jquery.once.bc

toolbar.escapeAdmin:
  version: VERSION
  js:
    js/escapeAdmin.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/drupalSettings
    - core/once
    - core/jquery.once.bc
