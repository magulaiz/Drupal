# Schema for the configuration files of the Navigation module.

navigation.settings:
  type: config_object
  label: 'Navigation settings'
  mapping:
    show_top_bar:
      type: boolean
      label: 'Show top bar'
      constraints:
        NotNull: []
    logo_provider:
      type: string
      label: 'Select Navigation logo handling'
      constraints:
        NotNull: []
    logo_managed:
      type: sequence
      label: 'Custom logo'
      sequence:
        type: integer
    logo_max_filesize:
      type: integer
      label: 'Maximum file sizes (bytes)'

navigation.block_layout:
  type: config_object
  mapping:
    sections:
      type: sequence
      sequence:
        type: layout_builder.section
