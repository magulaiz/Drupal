# Schema for the configuration files of the Navigation module.

navigation.settings:
  type: config_object
  label: 'Navigation settings'
  mapping:
    logo_provider:
      type: string
      label: 'Select Navigation logo handling'
      constraints:
        NotNull: []
    logo_managed:
      type: string
      label: 'Custom logo'
      nullable: true
      constraints:
        NotBlank:
          allowNull: true
    logo_max_filesize:
      type: integer
      label: 'Maximum file sizes (bytes)'
    logo_extensions:  
      type: string
      label: 'Supported logo extensions'
      constraints:
        NotNull: []

navigation.block_layout:
  type: config_object
  mapping:
    sections:
      type: sequence
      sequence:
        type: layout_builder.section

block.settings.navigation_menu:*:
  type: block_settings
  label: 'Menu block'
  mapping:
    level:
      type: integer
      label: 'Starting level'
    depth:
      type: integer
      label: 'Maximum number of levels'
