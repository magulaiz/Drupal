# Schema for the configuration files of the Navigation module.

navigation.settings:
  type: config_object
  label: 'Navigation settings'
  mapping:
    show_top_bar:
      type: boolean
      label: 'Show top bar'
      constraints:
        NotNull: []
    logo_provider:
      type: string
      label: 'Select Navigation logo handling'
      constraints:
        NotNull: []
    logo_managed:
      type: sequence
      label: 'Custom logo'
      sequence:
        type: integer
    logo_max_filesize:
      type: integer
      label: 'Maximum file sizes (bytes)'

navigation.navigation_block.*:
  type: config_entity
  label: Navigation Block
  mapping:
    id:
      type: machine_name
      label: ID
    region:
      type: string
      label: 'Region'
    weight:
      type: integer
      label: 'Weight'
    provider:
      type: string
      label: 'Provider'
    plugin:
      type: string
      label: 'Plugin'
      constraints:
        PluginExists:
          manager: plugin.manager.navigation_block
          interface: Drupal\navigation\NavigationBlockPluginInterface
    settings:
      type: navigation_block.settings.[%parent.plugin]
    visibility:
      type: sequence
      label: 'Visibility Conditions'
      sequence:
        type: condition.plugin.[id]
        label: 'Visibility Condition'

navigation_block.settings.system_menu_navigation_block:*:
  type: navigation_block_settings
  label: 'Menu navigation block'
  mapping:
    level:
      type: integer
      label: 'Starting level'
    depth:
      type: integer
      label: 'Maximum number of levels'
