services:
  plugin.manager.navigation_block:
    class: Drupal\navigation\NavigationBlockManager
    parent: default_plugin_manager
    arguments: ['@logger.channel.default']
  Drupal\navigation\NavigationBlockManagerInterface: '@plugin.manager.navigation_block'

  navigation_block.repository:
    class: Drupal\navigation\NavigationBlockRepository
    arguments: ['@entity_type.manager', '@context.handler']
  Drupal\navigation\NavigationBlockRepositoryInterface: '@navigation_block.repository'

  navigation.renderer:
    class: Drupal\navigation\NavigationRenderer
    arguments:
      [
        '@navigation_block.repository',
        '@config.factory',
        '@current_route_match',
        '@plugin.manager.menu.local_task',
        '@current_user',
        '@entity_type.manager',
        '@image.factory',
        '@file_url_generator',
        '@file_system',
      ]
  Drupal\navigation\NavigationRenderer: '@navigation.renderer'

  navigation.menu.invalidator:
    class: Drupal\navigation\Cache\SystemMenuNavigationBlockCacheTagInvalidator
    arguments: ['@plugin.manager.navigation_block', '@entity_type.manager']
    public: false
    tags:
      - { name: cache_tags_invalidator }

  navigation.menu_tree:
    class: Drupal\navigation\Menu\NavigationMenuLinkTree
    arguments:
      [
        '@menu.tree_storage',
        '@plugin.manager.menu.link',
        '@router.route_provider',
        '@menu.active_trail',
        '@callable_resolver',
      ]

  navigation.user_lazy_builder:
    class: Drupal\navigation\UserLazyBuilder
    arguments: ['@module_handler', '@current_user']
  Drupal\navigation\UserLazyBuilders: '@navigation.user_lazy_builder'
