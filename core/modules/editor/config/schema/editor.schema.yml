# Schema for the configuration files of the Editor module.

editor.editor.*:
  type: config_entity
  label: 'Text editor'
  mapping:
    format:
      type: string
      label: 'Name'
    editor:
      type: string
      label: 'Text editor'
      constraints:
        PluginExists:
          manager: plugin.manager.editor
          interface: Drupal\editor\Plugin\EditorPluginInterface
    settings:
      type: editor.settings.[%parent.editor]
    image_upload:
      type: mapping
      label: 'Image upload settings'
      constraints:
        ConditionallyRequiredKeys:
          condition:
            key: status
            value: true
          keys:
            - scheme
            - directory
            - max_size
            - max_dimensions
      mapping:
        status:
          type: boolean
          label: 'Status'
        scheme:
          # Conditionally required: only required if `status === true`. See ConditionallyRequiredKeys constraint.
          requiredKey: false
          type: string
          label: 'File storage'
        directory:
          # Conditionally required: only required if `status === true`. See ConditionallyRequiredKeys constraint.
          requiredKey: false
          type: string
          label: 'Upload directory'
        max_size:
          # Conditionally required: only required if `status === true`. See ConditionallyRequiredKeys constraint.
          requiredKey: false
          type: string
          label: 'Maximum file size'
        max_dimensions:
          # Conditionally required: only required if `status === true`. See ConditionallyRequiredKeys constraint.
          requiredKey: false
          type: mapping
          label: 'Maximum dimensions'
          mapping:
            width:
              type: integer
              nullable: true
              label: 'Maximum width'
            height:
              type: integer
              nullable: true
              label: 'Maximum height'
