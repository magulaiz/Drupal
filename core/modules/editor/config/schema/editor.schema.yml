# Schema for the configuration files of the Editor module.

editor.editor.*:
  type: config_entity
  label: 'Text editor'
  mapping:
    format:
      type: string
      label: 'Name'
    editor:
      type: string
      label: 'Text editor'
      constraints:
        PluginExists:
          manager: plugin.manager.editor
          interface: Drupal\editor\Plugin\EditorPluginInterface
    settings:
      type: editor.settings.[%parent.editor]
    image_upload:
      type: editor.image_upload_settings.[status]
      label: 'Image upload settings'
      mapping:
        status:
          type: boolean
          label: 'Status'

editor.image_upload_settings.*:
  type: mapping
  mapping:
    status:
      type: boolean
      label: 'Status'

editor.image_upload_settings.1:
  type: editor.image_upload_settings.*
  mapping:
    scheme:
      type: string
      label: 'File storage'
    directory:
      type: string
      label: 'Upload directory'
    max_size:
      type: string
      label: 'Maximum file size'
    max_dimensions:
      type: string
      label: 'Maximum dimensions'
      mapping:
        width:
          type: integer
          nullable: true
          label: 'Maximum width'
        height:
          type: integer
          nullable: true
          label: 'Maximum height'
