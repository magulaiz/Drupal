# Schema for configuration files of the Field UI module.

field_ui.settings:
  type: config_object
  label: 'Field UI settings'
  constraints:
    FullyValidatable: ~
  mapping:
    field_prefix:
      type: string
      label: 'The prefix for new fields created via Field UI'
      constraints:
        Regex:
          pattern: '/^[a-z0-9_]+$/'
          message: "The %value prefix is not valid."
        Length:
          # FieldStorageConfig::NAME_MAX_LENGTH is 32, which includes max:30.
          # Consider using it appropriately.
          # @see \Drupal\field\Entity\FieldStorageConfig::NAME_MAX_LENGTH
          max: 30
