ckeditor5.upload_image:
  path: '/ckeditor5/upload-image/{editor}'
  defaults:
    _controller: '\Drupal\ckeditor5\Controller\CKEditor5ImageController::upload'
  methods: [POST]
  requirements:
    _entity_access: 'editor.use'
    _custom_access: '\Drupal\ckeditor5\Controller\CKEditor5ImageController::imageUploadEnabledAccess'
    _csrf_token: 'TRUE'
  options:
    parameters:
      editor:
        type: entity:editor

ckeditor5.media_entity_metadata:
  path: '/ckeditor5/{editor}/media-entity-metadata'
  defaults:
    _controller: '\Drupal\ckeditor5\Controller\CKEditor5MediaController::mediaEntityMetadata'
  methods: [GET]
  requirements:
    _entity_access: 'editor.use'
    _custom_access: '\Drupal\ckeditor5\Controller\CKEditor5MediaController::access'
    _csrf_token: 'TRUE'
  options:
    parameters:
      editor:
        type: entity:editor

ckeditor5.entity_link_suggestions:
  path: '/ckeditor5/entity-link-suggestions/{host_entity_type_id}/{host_entity_langcode}'
  defaults:
    _controller: '\Drupal\ckeditor5\Controller\EntityLinkSuggestionsController::suggestions'
  methods: [GET]
  requirements:
    # The returned information relies entirely on entity access.
    # Note that this specifically does not use a Text Editor permission check
    # to allow the browser to rely on its private cache for cross-editor reuse
    # of entity link suggestions.
    _access: 'TRUE'
    # @todo `_csrf_token` check like for the other routes; that does not impede cacheability
  options:
    no_cache: TRUE
    _theme: ajax_base_page
