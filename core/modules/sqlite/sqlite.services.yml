# By default, Drupal uses a non-transactional database connection in
# circumstances where waiting for a transaction to commit would result in
# data inconsistency or race conditions. SQLite initiates an exclusive lock
# for transactions, which precludes the use of the non-transactional connection.

# This file contains only service overrides for core services defined in
# core.services.yml. Other overrides are specified in module services files,
# e.g. views.

services:
  sqlite.queue.database:
    class: Drupal\Core\Queue\QueueDatabaseFactory
    arguments: ['@database']
    public: false
  sqlite.lock:
    class: Drupal\Core\Lock\DatabaseLockBackend
    arguments: ['@database']
    public: false
    lazy: true
  sqlite.lock.persistent:
    class: Drupal\Core\Lock\PersistentDatabaseLockBackend
    arguments: ['@database']
    public: false
  sqlite.session_handler.storage:
    class: Drupal\Core\Session\SessionHandler
    arguments: ['@request_stack', '@database', '@datetime.time']
    public: false
  sqlite.cache.backend.database:
    class: Drupal\Core\Cache\DatabaseBackendFactory
    arguments: ['@database', '@cache_tags.invalidator.checksum', '@settings', '@serialization.phpserialize', '@datetime.time']
    public: false
