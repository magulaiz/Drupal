entity.taxonomy_term.add_form:
  path: '/admin/structure/taxonomy/manage/{taxonomy_vocabulary}/add'
  defaults:
    _controller: '\Drupal\taxonomy\Controller\TaxonomyController::addForm'
    _title: 'Add term'
  requirements:
    _entity_create_access: 'taxonomy_term:{taxonomy_vocabulary}'

entity.taxonomy_term.edit_form:
  path: '/taxonomy/term/{taxonomy_term}/edit'
  defaults:
    _entity_form: 'taxonomy_term.default'
    _title: 'Edit term'
  options:
    _admin_route: TRUE
  requirements:
    _entity_access: 'taxonomy_term.update'
    taxonomy_term: \d+

entity.taxonomy_term.delete_form:
  path: '/taxonomy/term/{taxonomy_term}/delete'
  defaults:
    _entity_form: 'taxonomy_term.delete'
    _title: 'Delete term'
  options:
    _admin_route: TRUE
  requirements:
    _entity_access: 'taxonomy_term.delete'
    taxonomy_term: \d+

entity.taxonomy_term.canonical:
  path: '/taxonomy/term/{taxonomy_term}'
  defaults:
    _entity_view: 'taxonomy_term.full'
    _title: 'Taxonomy term'
    _title_callback: '\Drupal\taxonomy\Controller\TaxonomyController::termTitle'
  requirements:
    _entity_access: 'taxonomy_term.view'
    taxonomy_term: \d+

entity.taxonomy_term.version_history:
  path: '/taxonomy/term/{taxonomy_term}/revisions'
  defaults:
    _title: 'Revisions'
    _controller: '\Drupal\taxonomy\Controller\TaxonomyController::revisionOverview'
  requirements:
    _entity_access: 'taxonomy_term.view all revisions'
    taxonomy_term: \d+
  options:
    _admin_route: TRUE
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term

entity.taxonomy_term.revision:
  path: '/taxonomy/term/{taxonomy_term}/revisions/{taxonomy_term_revision}/view'
  defaults:
    _controller: '\Drupal\taxonomy\Controller\TaxonomyController::revisionShow'
    _title_callback: '\Drupal\taxonomy\Controller\TaxonomyController::revisionPageTitle'
  requirements:
    _entity_access: 'taxonomy_term_revision.view revision'
    taxonomy_term: \d+
  options:
    _admin_route: TRUE
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term
      taxonomy_term_revision:
        type: entity_revision:taxonomy_term

entity.taxonomy_term.revision_revert_confirm:
  path: '/taxonomy/term/{taxonomy_term}/revisions/{taxonomy_term_revision}/revert'
  defaults:
    _form: '\Drupal\taxonomy\Form\TaxonomyRevisionRevertForm'
    _title: 'Revert to earlier revision'
  requirements:
    _entity_access: 'taxonomy_term_revision.revert revision'
    taxonomy_term: \d+
  options:
    _admin_route: TRUE
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term
      taxonomy_term_revision:
        type: entity_revision:taxonomy_term

entity.taxonomy_term.revision_revert_translation_confirm:
  path: '/taxonomy/term/{taxonomy_term}/revisions/{taxonomy_term_revision}/revert/{langcode}'
  defaults:
    _form: '\Drupal\taxonomy\Form\TaxonomyRevisionRevertTranslationForm'
    _title: 'Revert to earlier revision of a translation'
  requirements:
    _entity_access: 'taxonomy_term_revision.revert revision'
    taxonomy_term: \d+
  options:
    _admin_route: TRUE
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term
      taxonomy_term_revision:
        type: entity_revision:taxonomy_term

entity.taxonomy_term.revision_delete_confirm:
  path: '/taxonomy/term/{taxonomy_term}/revisions/{taxonomy_term_revision}/delete'
  defaults:
    _form: '\Drupal\taxonomy\Form\TaxonomyRevisionDeleteForm'
    _title: 'Delete earlier revision'
  requirements:
    _entity_access: 'taxonomy_term_revision.delete revision'
    taxonomy_term: \d+
  options:
    _admin_route: TRUE
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term
      taxonomy_term_revision:
        type: entity_revision:taxonomy_term
