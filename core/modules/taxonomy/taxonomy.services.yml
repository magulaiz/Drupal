services:
  _defaults:
    autoconfigure: true
  taxonomy_term.breadcrumb:
    class: Drupal\taxonomy\TermBreadcrumbBuilder
    arguments: ['@entity_type.manager', '@entity.repository']
    tags:
      - { name: breadcrumb_builder, priority: 1002 }
  taxonomy_term.taxonomy_term_route_context:
    class: Drupal\taxonomy\ContextProvider\TermRouteContext
    arguments: ['@current_route_match']
    tags:
      - { name: 'context_provider' }
  taxonomy.node_index:
    class: Drupal\taxonomy\NodeIndex
    arguments: ['@config.factory', '@database', '@entity_type.manager']
    tags:
      - { name: 'node_index'}
  Drupal\taxonomy\NodeIndex: '@taxonomy.node_index'
