administer taxonomy:
  title: 'Administer vocabularies and terms'

access taxonomy overview:
  title: 'Access the taxonomy vocabulary overview page'
  description: 'Get an overview of all taxonomy vocabularies.'

revert all taxonomy revisions:
  title: 'Revert all taxonomy revisions'
  description: 'To revert a revision, you also need permission to edit the taxonomy item.'

delete all taxonomy revisions:
  title: 'Delete all taxonomy revisions'
  description: 'To delete a revision, you also need permission to delete the taxonomy item.'

permission_callbacks:
  - Drupal\taxonomy\TaxonomyPermissions::permissions
