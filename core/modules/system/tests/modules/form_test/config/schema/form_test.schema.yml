form_test.object:
  type: config_object
  label: 'Test form'
  mapping:
    bananas:
      type: string
      label: 'Bananas'
    favorite_fruits:
      type: sequence
      label: 'Favorite fruits'
      sequence:
        type: required_label
        label: 'Fruit'
    favorite_vegetable:
      type: required_label
      label: 'Favorite vegetable'
      constraints:
        NotEqualTo:
          value: durian
          message: 'Absolutely not. Durians are the worst.'
        Regex:
          pattern: '/^d/i'
          match: false
          message: 'Your favorite vegetable cannot begin with the letter D.'
    nemesis_vegetable:
      type: label
      label: 'Nemesis vegetable'
    could_not_live_without:
      type: string
      label: 'Which could you not live without: vegetables or fruits?'
      constraints:
        Choice:
          - fruits
          - vegetables
