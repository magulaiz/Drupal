services:
  module_cache_bin_delegated.memory_cache:
    class: Drupal\Core\Cache\MemoryCache\MemoryCache
  module_cache_bin_delegated.deprecated_missing_bin_tag:
    class: Drupal\Core\Cache\BackendChain
    calls:
      - [appendBackend, ['@module_cache_bin_delegated.memory_cache']]
    tags:
      # This is purposely missing a bin tag to trigger deprecation testing.
      - { name: cache.bin }
