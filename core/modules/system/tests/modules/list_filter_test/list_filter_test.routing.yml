list_filter_test.div_and_p:
  path: /list-filter-test/div-and-p
  defaults:
    _title: 'List filter test: DIV and P'
    _controller: '\Drupal\list_filter_test\Controller\ListFilterTestController::contentDivAndP'
  requirements:
    _access: 'TRUE'

list_filter_test.list:
  path: /list-filter-test/list
  defaults:
    _title: 'List filter test: list'
    _controller: '\Drupal\list_filter_test\Controller\ListFilterTestController::contentList'
  requirements:
    _access: 'TRUE'

list_filter_test.table:
  path: /list-filter-test/table
  defaults:
    _title: 'List filter test: table'
    _controller: '\Drupal\list_filter_test\Controller\ListFilterTestController::contentTable'
  requirements:
    _access: 'TRUE'
