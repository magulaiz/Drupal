name: 'Theme test subsubtheme'
type: theme
description: 'Test theme which uses test_subtheme as the base theme.'
version: VERSION
base theme: test_subtheme
libraries-override:
  test_base_theme/global-styling:
    css:
      base:
        css/sub-sub-last-override.css: false
  core/drupal.dialog:
    js:
      misc/dialog/dialog.js: js/subsubtheme-dialog.js
  core/normalize:
    css:
      base:
        assets/vendor/normalize-css/normalize.css: false
