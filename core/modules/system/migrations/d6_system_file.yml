id: d6_system_file
label: File system configuration
migration_tags:
  - Drupal 6
  - Configuration
source:
  plugin: variable
  variables:
    - allow_insecure_uploads
  source_module: system
process:
  allow_insecure_uploads:
    plugin: evaluate_condition
    condition: empty
    negate: true
    source: allow_insecure_uploads
destination:
  plugin: config
  config_name: system.file
