id: action_settings
label: Action configuration
deprecation_message: Deprecated in drupal:10.3.0 and is removed in drupal:11.0.0. There is no replacement. See https://www.drupal.org/node/3413338
migration_tags:
  - Drupal 6
  - Drupal 7
  - Configuration
source:
  plugin: variable
  variables:
    - actions_max_stack
  source_module: system
process:
  recursion_limit:
    plugin: skip_on_empty
    method: row
    source: empty
destination:
  plugin: config
  config_name: null
  destination_module: system
