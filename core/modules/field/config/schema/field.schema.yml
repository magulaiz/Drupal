# Schema for configuration files of the Field module.

field.settings:
  type: config_object
  label: 'Field settings'
  mapping:
    purge_batch_size:
      type: integer
      label: 'Maximum number of field data records to purge'

field.storage.*.*:
  type: config_entity
  label: 'Field'
  constraints:
    IsUnchanged:
      selector: locked
    IsFalse:
      selector: locked
  mapping:
    id:
      type: string
      label: 'ID'
      constraints:
        NotNull: []
        StringParts:
          separator: .
          parts:
            - entity_type
            - field_name
    field_name:
      type: string
      label: 'Field name'
      constraints:
        NotNull: []
        # Note: typically but optionally, this would use `field_ui.settings`' `field_prefix` value as the first part.
        MachineName: []
        # UniqueField: []
    entity_type:
      type: string
      label: 'Entity type'
      constraints:
        NotNull: []
        PluginExists:
          manager: entity_type.manager
          interface: '\Drupal\Core\Entity\FieldableEntityInterface'
    type:
      type: string
      label: 'Type'
      constraints:
        NotBlank: []
        # @todo In principle, we should validate that this plugin was indeed provided by `module`.
        PluginExists: plugin.manager.field.field_type
    settings:
      type: field.storage_settings.[%parent.type]
    module:
      type: string
      label: 'Module'
      constraints:
        NotBlank: []
        # ExtensionExists: 'module'
    locked:
      type: boolean
      label: 'Locked'
      constraints:
        NotNull: []
    cardinality:
      type: integer
      label: 'Maximum number of values users can enter'
      constraints:
        NotNull: []
        # NoEntitiesExistYetWithHigherCardinality: []
    translatable:
      type: boolean
      label: 'Translatable'
      constraints:
        NotNull: []
    indexes:
      type: sequence
      label: 'Indexes'
      # @todo Constraints — but shockingly this A) uses `type: ignore`, B) has zero validation logic in core?!
      sequence:
        type: sequence
        label: 'Indexes'
        sequence:
          type: ignore
          label: 'Index'
    persist_with_no_fields:
      type: boolean
      label: 'Persist field storage with no fields'
      constraints:
        NotNull: []
    custom_storage:
      type: boolean
      label: 'Enable custom storage'
      constraints:
        NotNull: []

field.field.*.*.*:
  type: field_config_base
  label: 'Field'
  constraints:
    FieldIsConfigurableField:
      entityType: entity_type
      fieldName: field_name
