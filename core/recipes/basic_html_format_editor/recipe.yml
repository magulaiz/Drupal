name: 'Basic HTML editor'
description: 'Provides "Basic HTML" text format along with WYSIWYG editor and related configuration.'
type: 'Text format editor'
install:
  - editor
  - filter
  - ckeditor5
config:
  actions:
    filter.format.basic_html:
      createIfNotExists:
        name: 'Basic HTML'
        format: basic_html
        weight: 0
        roles:
          - authenticated
        filters:
          editor_file_reference:
            id: editor_file_reference
            provider: editor
            status: true
            weight: 11
            settings: {  }
          filter_align:
            id: filter_align
            provider: filter
            status: true
            weight: 7
            settings: {  }
          filter_caption:
            id: filter_caption
            provider: filter
            status: true
            weight: 8
            settings: {  }
          filter_html:
            id: filter_html
            provider: filter
            status: true
            weight: -10
            settings:
              allowed_html: '<br> <p> <h2 id> <h3 id> <h4 id> <h5 id> <h6 id> <cite> <dl> <dt> <dd> <a hreflang href> <blockquote cite> <ul type> <ol start type> <strong> <em> <code> <li> <img src alt data-entity-uuid data-entity-type height width data-caption data-align>'
              filter_html_help: false
              filter_html_nofollow: false
          filter_html_image_secure:
            id: filter_html_image_secure
            provider: filter
            status: true
            weight: 9
            settings: {  }
          filter_image_lazy_load:
            id: filter_image_lazy_load
            provider: filter
            status: true
            weight: 15
            settings: {  }
    editor.editor.basic_html:
      createIfNotExists:
        format: basic_html
        editor: ckeditor5
        settings:
          toolbar:
            items:
              - bold
              - italic
              - '|'
              - link
              - '|'
              - bulletedList
              - numberedList
              - '|'
              - blockQuote
              - drupalInsertImage
              - '|'
              - heading
              - code
              - '|'
              - sourceEditing
          plugins:
            ckeditor5_heading:
              enabled_headings:
                - heading2
                - heading3
                - heading4
                - heading5
                - heading6
            ckeditor5_imageResize:
              allow_resize: true
            ckeditor5_list:
              properties:
                reversed: false
                startIndex: true
              multiBlock: true
            ckeditor5_sourceEditing:
              allowed_tags:
                - '<cite>'
                - '<dl>'
                - '<dt>'
                - '<dd>'
                - '<a hreflang>'
                - '<blockquote cite>'
                - '<ul type>'
                - '<ol type>'
                - '<h2 id>'
                - '<h3 id>'
                - '<h4 id>'
                - '<h5 id>'
                - '<h6 id>'
        image_upload:
          status: true
          scheme: public
          directory: inline-images
          max_size: null
          max_dimensions:
            width: null
            height: null
    user.role.authenticated:
      grantPermission: 'use text format basic_html'
