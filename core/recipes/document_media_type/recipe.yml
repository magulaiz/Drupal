name: 'Document media type'
description: 'Provides "Document" media type and related configuration to enable uploaded files or documents, such as a PDF.'
type: 'Media type'
install:
  - media_library
  - path
  - views
config:
  import:
    file:
      - views.view.files
    media_library:
      - core.entity_view_mode.media.media_library
      - core.entity_form_mode.media.media_library
      - image.style.media_library
      - views.view.media_library
    media:
      - core.entity_view_mode.media.full
      - system.action.media_delete_action
      - system.action.media_publish_action
      - system.action.media_save_action
      - system.action.media_unpublish_action
      - views.view.media
    image:
      - image.style.thumbnail
  actions:
    media.type.document:
      createIfNotExists:
        id: document
        label: Document
        description: 'An uploaded file or document, such as a PDF.'
        source: file
        queue_thumbnail_downloads: false
        new_revision: true
        source_configuration:
          source_field: field_media_document
        field_map:
          name: name
    field.storage.media.field_media_document:
      createIfNotExists:
        id: media.field_media_document
        field_name: field_media_document
        entity_type: media
        type: file
        settings:
          target_type: file
          display_field: false
          display_default: false
          uri_scheme: public
        module: file
        locked: false
        cardinality: 1
        translatable: true
        indexes: {  }
        persist_with_no_fields: false
        custom_storage: false
    field.field.media.document.field_media_document:
      createIfNotExists:
        id: media.document.field_media_document
        field_name: field_media_document
        entity_type: media
        bundle: document
        label: Document
        description: ''
        required: true
        translatable: true
        default_value: {  }
        default_value_callback: ''
        settings:
          handler: 'default:file'
          handler_settings: {  }
          file_directory: '[date:custom:Y]-[date:custom:m]'
          file_extensions: 'txt rtf doc docx ppt pptx xls xlsx pdf odf odg odp ods odt fodt fods fodp fodg key numbers pages'
          max_filesize: ''
          description_field: false
        field_type: file
    core.entity_form_display.media.document.default:
      createIfNotExists:
        id: media.document.default
        targetEntityType: media
        bundle: document
        mode: default
        content:
          created:
            type: datetime_timestamp
            weight: 10
            region: content
            settings: {  }
            third_party_settings: {  }
          field_media_document:
            type: file_generic
            weight: 0
            region: content
            settings:
              progress_indicator: throbber
            third_party_settings: {  }
          path:
            type: path
            weight: 30
            region: content
            settings: {  }
            third_party_settings: {  }
          status:
            type: boolean_checkbox
            weight: 100
            region: content
            settings:
              display_label: true
            third_party_settings: {  }
          uid:
            type: entity_reference_autocomplete
            weight: 5
            region: content
            settings:
              match_operator: CONTAINS
              match_limit: 10
              size: 60
              placeholder: ''
            third_party_settings: {  }
        hidden:
          name: true
    core.entity_form_display.media.document.media_library:
      createIfNotExists:
        id: media.document.media_library
        targetEntityType: media
        bundle: document
        mode: media_library
        content: {  }
        hidden:
          created: true
          field_media_document: true
          name: true
          path: true
          status: true
          uid: true
    core.entity_view_display.media.document.default:
      createIfNotExists:
        id: media.document.default
        targetEntityType: media
        bundle: document
        mode: default
        content:
          field_media_document:
            type: file_default
            label: visually_hidden
            settings: {  }
            third_party_settings: {  }
            weight: 1
            region: content
        hidden:
          created: true
          name: true
          thumbnail: true
          uid: true
    core.entity_view_display.media.document.media_library:
      createIfNotExists:
        id: media.document.media_library
        targetEntityType: media
        bundle: document
        mode: media_library
        content:
          thumbnail:
            type: image
            label: hidden
            settings:
              image_style: thumbnail
              image_link: ''
              image_loading:
                attribute: lazy
            third_party_settings: {  }
            weight: 0
            region: content
        hidden:
          created: true
          field_media_document: true
          name: true
          uid: true
