name: 'Basic block'
description: 'Provides "Basic block" custom block type and related configuration. A basic block contains a title and a body.'
type: 'Block type'
install:
  - block_content
  - field
  - views
config:
  import:
    block_content:
      - field.storage.block_content.body
      - core.entity_view_mode.block_content.full
      - views.view.block_content
  actions:
    block_content.type.basic:
      createIfNotExists:
        id: basic
        label: 'Basic block'
        revision: false
        description: 'A basic block contains a title and a body.'
    field.field.block_content.basic.body:
      createIfNotExists:
        id: block_content.basic.body
        field_name: body
        entity_type: block_content
        bundle: basic
        label: Body
        description: ''
        required: false
        translatable: true
        default_value: {  }
        default_value_callback: ''
        settings:
          display_summary: false
          required_summary: false
        field_type: text_with_summary
    core.entity_form_display.block_content.basic.default:
      createIfNotExists:
        id: block_content.basic.default
        targetEntityType: block_content
        bundle: basic
        mode: default
        content:
          body:
            type: text_textarea_with_summary
            weight: -4
            region: content
            settings:
              rows: 9
              summary_rows: 3
              placeholder: ''
              show_summary: false
            third_party_settings: {  }
          info:
            type: string_textfield
            weight: -5
            region: content
            settings:
              size: 60
              placeholder: ''
            third_party_settings: {  }
        hidden: {  }
    core.entity_view_display.block_content.basic.default:
      createIfNotExists:
        id: block_content.basic.default
        targetEntityType: block_content
        bundle: basic
        mode: default
        content:
          body:
            type: text_default
            label: hidden
            settings: {  }
            third_party_settings: {  }
            weight: 0
            region: content
        hidden: {  }
