name: 'Image media type'
description: 'Provides "Image" media type and related configuration. Use local images for reusable media.'
type: 'Media type'
install:
  - media
  - media_library
  - path
  - views
config:
  import:
    file:
      - views.view.files
    media_library:
      - core.entity_view_mode.media.media_library
      - core.entity_form_mode.media.media_library
      - image.style.media_library
      - views.view.media_library
    media:
      - core.entity_view_mode.media.full
      - system.action.media_delete_action
      - system.action.media_publish_action
      - system.action.media_save_action
      - system.action.media_unpublish_action
      - views.view.media
    image:
      - image.style.medium
      - image.style.large
      - image.style.thumbnail
  actions:
    media.type.image:
      createIfNotExists:
        id: image
        label: Image
        description: 'Use local images for reusable media.'
        source: image
        queue_thumbnail_downloads: false
        new_revision: true
        source_configuration:
          source_field: field_media_image
        field_map:
          name: name
    field.storage.media.field_media_image:
      createIfNotExists:
        id: media.field_media_image
        field_name: field_media_image
        entity_type: media
        type: image
        settings:
          target_type: file
          display_field: false
          display_default: false
          uri_scheme: public
          default_image:
            uuid: null
            alt: ''
            title: ''
            width: null
            height: null
        module: image
        locked: false
        cardinality: 1
        translatable: true
        indexes: {  }
        persist_with_no_fields: false
        custom_storage: false
    field.field.media.image.field_media_image:
      createIfNotExists:
        id: media.image.field_media_image
        field_name: field_media_image
        entity_type: media
        bundle: image
        label: Image
        description: ''
        required: true
        translatable: true
        default_value: {  }
        default_value_callback: ''
        settings:
          handler: 'default:file'
          handler_settings: {  }
          file_directory: '[date:custom:Y]-[date:custom:m]'
          file_extensions: 'png gif jpg jpeg webp'
          max_filesize: ''
          max_resolution: ''
          min_resolution: ''
          alt_field: true
          alt_field_required: true
          title_field: false
          title_field_required: false
          default_image:
            uuid: null
            alt: ''
            title: ''
            width: null
            height: null
        field_type: image
    core.entity_form_display.media.image.default:
      createIfNotExists:
        id: media.image.default
        targetEntityType: media
        bundle: image
        mode: default
        content:
          created:
            type: datetime_timestamp
            weight: 10
            region: content
            settings: {  }
            third_party_settings: {  }
          field_media_image:
            type: image_image
            weight: 0
            region: content
            settings:
              progress_indicator: throbber
              preview_image_style: thumbnail
            third_party_settings: {  }
          path:
            type: path
            weight: 30
            region: content
            settings: {  }
            third_party_settings: {  }
          status:
            type: boolean_checkbox
            weight: 100
            region: content
            settings:
              display_label: true
            third_party_settings: {  }
          uid:
            type: entity_reference_autocomplete
            weight: 5
            region: content
            settings:
              match_operator: CONTAINS
              match_limit: 10
              size: 60
              placeholder: ''
            third_party_settings: {  }
        hidden:
          name: true
    core.entity_form_display.media.image.media_library:
      createIfNotExists:
        id: media.image.media_library
        targetEntityType: media
        bundle: image
        mode: media_library
        content:
          field_media_image:
            type: image_image
            weight: 1
            region: content
            settings:
              progress_indicator: throbber
              preview_image_style: thumbnail
            third_party_settings: {  }
        hidden:
          created: true
          name: true
          path: true
          status: true
          uid: true
    core.entity_view_display.media.image.default:
      createIfNotExists:
        id: media.image.default
        targetEntityType: media
        bundle: image
        mode: default
        content:
          field_media_image:
            type: image
            label: visually_hidden
            settings:
              image_style: large
              image_link: ''
              image_loading:
                attribute: lazy
            third_party_settings: {  }
            weight: 1
            region: content
        hidden:
          created: true
          name: true
          thumbnail: true
          uid: true
    core.entity_view_display.media.image.media_library:
      createIfNotExists:
        id: media.image.media_library
        targetEntityType: media
        bundle: image
        mode: media_library
        content:
          thumbnail:
            type: image
            label: hidden
            settings:
              image_style: medium
              image_link: ''
              image_loading:
                attribute: lazy
            third_party_settings: {  }
            weight: 0
            region: content
        hidden:
          created: true
          field_media_image: true
          name: true
          uid: true
