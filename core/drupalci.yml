# This is the DrupalCI testbot build file for Drupal core.
# Learn to make one for your own drupal.org project:
# https://www.drupal.org/drupalorg/docs/drupal-ci/customizing-drupalci-testing
build:
  assessment:
    validate_codebase:
      phpcs:
        sniff-all-files: true
      container_command:
        commands:
          - "cd core && sudo -u www-data /var/www/html/vendor/bin/phpcs -s --report-full=/var/lib/drupalci/workdir/yarn_install/codesniffer_results_full.txt --report-source=/var/lib/drupalci/workdir/phpcs/codesniffer_source.txt /var/www/html/core"
    testing:
      # TEMP remove all phpunit tests, for efficiency and to save resources.
