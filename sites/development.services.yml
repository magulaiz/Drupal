# Local development services.
#
# To activate this feature, follow the instructions at the top of the
# 'example.settings.local.php' file, which sits next to this file.
# 
# The development.services.yml file, allows the developer to override
# container parameters for debugging. In Drupal's configuration system,
# all the files that provide container definitions are merged using a Shallow
# Merge approach within \Drupal\Core\DependencyInjection\YamlFileLoader.
# This means that with a Shallow Merge, nested structures within the YAML
# files are not recursively merged as they would be with a Deep Merge.
#
# For example, consider the following configuration snippet from
# default.services.yml:
#
# renderer.config:
#   required_cache_contexts: ['languages:language_interface', 'theme', 'user.permissions']
#   auto_placeholder_conditions:
#     max-age: 0
#     contexts: ['session', 'user']
#     tags: []
#   debug: false
#
# Suppose you want to override the value of the 'debug' key within the
# 'renderer.config' parameter to true. In this case, you would specify all
# the other keys and their default values from the default.services.yml
# file in your development.services.yml file, like so:
#
# renderer.config:
#   required_cache_contexts: ['languages:language_interface', 'theme', 'user.permissions']
#   auto_placeholder_conditions:
#     max-age: 0
#     contexts: ['session', 'user']
#     tags: []
#   debug: true
#
# It's crucial to include all the parameter's keys because certain parameters
# may have dependencies or requirements. For instance, in the provided
# example, the 'renderer.config' parameter requires the
# 'required_cache_contexts' key to be defined. If you were to override just
# the 'debug' key without including the other necessary keys like this:
#
# renderer.config:
#    debug: true
#
# the site would crash because the renderer requires the
# 'required_cache_contexts' key to function properly.
parameters:
  http.response.debug_cacheability_headers: true
services:
  cache.backend.null:
    class: Drupal\Core\Cache\NullBackendFactory
